<div class="admin-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <i class="fas fa-gem"></i>
      <span>BLACK CODE</span>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li>
          <a routerLink="/admin/tickets" routerLinkActive="active">
            <span class="icon"><i class="fas fa-ticket-alt"></i></span>
            <span>Gestionar Tickets</span>
          </a>
        </li>

        <li>
          <a routerLink="/admin/usuarios" routerLinkActive="active">
            <span class="icon"><i class="fas fa-users"></i></span>
            <span>Gestión de Usuarios</span>
          </a>
        </li>

        <li>
          <a routerLink="/admin/accesos" routerLinkActive="active">
            <span class="icon"><i class="fas fa-clock"></i></span>
            <span>Últimos Accesos</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button (click)="onLogout()" class="btn-logout">
        <i class="fas fa-sign-out-alt"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <main class="main-layout">
    <header class="top-header">
      <div class="breadcrumb">
        <span>Admin</span> / <strong>Panel de Control</strong>
      </div>
      <div class="user-info">
        <span>Administrador</span>
        <div class="avatar">A</div>
      </div>
    </header>

    <section class="content-body">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
