<div class="login-container">
  <div class="login-wrapper">
    <div class="brand-panel">
      <div class="brand-content">
        <div class="brand-logo">
          <h1>BLACK CODE</h1>
          <p class="tagline">DESCIFRA TU ESTILO</p>
        </div>
        <p class="brand-description">Crea una nueva llave de acceso para tu cuenta exclusiva.</p>
      </div>
    </div>

    <div class="form-panel">
      <div class="form-wrapper">
        <h2 class="form-title">
          <i class="fas fa-lock-open"></i> Restablecer Contraseña
        </h2>

        <div class="alert alert-danger" *ngIf="errorMessage">
          <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
        </div>
        <div class="alert alert-success" *ngIf="successMessage">
          <i class="fas fa-check-circle"></i> {{ successMessage }}
        </div>

        <form (ngSubmit)="onResetPassword()" *ngIf="tokenValido && !successMessage">
          <div class="form-group">
            <label><i class="fas fa-key"></i> Nueva Contraseña</label>
            <input type="password" [(ngModel)]="nuevaPassword" name="pwd" class="form-control" placeholder="Mínimo 6 caracteres">
          </div>

          <div class="form-group">
            <label><i class="fas fa-check-double"></i> Confirmar Contraseña</label>
            <input type="password" [(ngModel)]="confirmarPassword" name="pwdConfirm" class="form-control" placeholder="Repite tu contraseña">
          </div>

          <button type="submit" class="btn-primary" [disabled]="loading">
            <span *ngIf="!loading">Actualizar Contraseña</span>
            <span *ngIf="loading"><i class="fas fa-spinner fa-spin"></i> Guardando...</span>
          </button>
        </form>

        <a routerLink="/login" class="link-back">
          <i class="fas fa-arrow-left"></i> Volver al inicio
        </a>
      </div>
    </div>
  </div>
</div>
